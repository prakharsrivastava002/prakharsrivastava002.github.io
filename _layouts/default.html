<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.data.profile.name }}</title>
  <meta name="description" content="{{ page.description | default: site.data.profile.headline }}">
  <meta name="author" content="{{ site.data.profile.name }}">
  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}{{ site.data.profile.name }}">
  <meta property="og:description" content="{{ page.description | default: site.data.profile.headline }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/assets/img/photo.jpg' | absolute_url }}">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
